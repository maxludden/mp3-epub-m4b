[project]
name = "audiobook-kit"
version = "0.1.0"
description = "Convert single-file audiobooks plus EPUBs into chaptered M4B files"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "loguru>=0.7",
    "lxml",
    "rich>=13",
    "rich-gradient>=0.3.13",
    "typer>=0.12",
]

[project.scripts]
audiobook-kit = "audiobook_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_kit"]

[dependency-groups]
dev = [
    "lxml-stubs",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
